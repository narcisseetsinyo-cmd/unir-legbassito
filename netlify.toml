# Publication du site sur Netlify (à chaque modification, y compris depuis /admin)
[build]
  command = "node tools/build-news-index.mjs"
  publish = "."

[functions]
  directory = "netlify/functions"

# L'espace admin et le contenu ne doivent pas rester en cache trop longtemps
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex"
